name: Blackboard Summarizer

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: blackboard-summarizer
  cancel-in-progress: false

jobs:
  check-and-summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Check if summarization is needed
        id: check
        run: |
          ENTRIES=$(curl -sf https://blackboard.jass.school/api/log)
          COUNT=$(echo "$ENTRIES" | python3 -c "
          import json, sys
          entries = json.loads(sys.stdin.read())
          last_idx = -1
          for i, e in enumerate(entries):
              if 'blackboard_context_compressor' in e:
                  last_idx = i
          remaining = len(entries) - last_idx - 1
          print(remaining)
          ")
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "Messages after last summary: $COUNT"
          if [ "$COUNT" -ge 10 ]; then
            echo "needs_summary=true" >> $GITHUB_OUTPUT
            echo "Summarization needed."
          else
            echo "needs_summary=false" >> $GITHUB_OUTPUT
            echo "Not enough messages yet."
          fi

      - name: Checkout Territory_maintenance
        if: steps.check.outputs.needs_summary == 'true'
        uses: actions/checkout@v4
        with:
          repository: JASS-2026-Cyprus/Territory_maintenance

      - name: Set up Python
        if: steps.check.outputs.needs_summary == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        if: steps.check.outputs.needs_summary == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        if: steps.check.outputs.needs_summary == 'true'
        run: pip install -r requirements.txt

      - name: Run summarizer
        if: steps.check.outputs.needs_summary == 'true'
        run: python -m llm_blackboard
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
