name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: robocy-lab/deploy-action@main
        with:
          host: server2026.jass.school
          ssh-user: jass
          ssh-key: ${{ secrets.SERVER_SSH_KEY }}
          cloudflare-tunnel: 'true'
          github-token: ${{ secrets.GH_PAT }}
          directory: /home/jass/territory-ops
          env-vars: |
            GH_PAT=${{ secrets.GH_PAT }}
            LLM_API_KEY=${{ secrets.LLM_API_KEY }}
