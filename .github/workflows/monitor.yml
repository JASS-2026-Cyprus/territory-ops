name: Monitor

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check-and-act:
    runs-on: ubuntu-latest
    steps:
      - name: Get Territory_maintenance SHA
        id: sha
        run: |
          SHA=$(gh api repos/JASS-2026-Cyprus/Territory_maintenance/commits/main --jq '.sha')
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "Current SHA: $SHA"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Restore deploy cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/deploy-state
          key: deployed-sha-${{ steps.sha.outputs.sha }}

      - name: Deploy
        if: steps.cache.outputs.cache-hit != 'true'
        uses: robocy-lab/deploy-action@main
        with:
          host: server2026.jass.school
          ssh-user: jass
          ssh-key: ${{ secrets.SERVER_SSH_KEY }}
          cloudflare-tunnel: 'true'
          github-token: ${{ secrets.GH_PAT }}
          directory: /home/jass/territory-ops
          env-vars: |
            GITHUB_TOKEN=${{ secrets.GH_PAT }}
            CACHEBUST=${{ steps.sha.outputs.sha }}
            LLM_API_KEY=${{ secrets.LLM_API_KEY }}

      - name: Save deploy state
        if: steps.cache.outputs.cache-hit != 'true'
        run: mkdir -p /tmp/deploy-state && touch /tmp/deploy-state/deployed

      - name: Save deploy cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/deploy-state
          key: deployed-sha-${{ steps.sha.outputs.sha }}

      - name: Check blackboard
        id: blackboard
        run: |
          ENTRIES=$(curl -sf https://blackboard.jass.school/api/log)
          COUNT=$(echo "$ENTRIES" | python3 -c "
          import json, sys
          entries = json.loads(sys.stdin.read())
          last_idx = -1
          for i, e in enumerate(entries):
              if 'blackboard_context_compressor' in e:
                  last_idx = i
          print(len(entries) - last_idx - 1)
          ")
          echo "Messages after last summary: $COUNT"
          [ "$COUNT" -ge 10 ] && echo "needs_summary=true" >> $GITHUB_OUTPUT || echo "needs_summary=false" >> $GITHUB_OUTPUT

      - name: Checkout Territory_maintenance
        if: steps.blackboard.outputs.needs_summary == 'true'
        uses: actions/checkout@v4
        with:
          repository: JASS-2026-Cyprus/Territory_maintenance
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        if: steps.blackboard.outputs.needs_summary == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.blackboard.outputs.needs_summary == 'true'
        run: pip install -r requirements.txt

      - name: Run summarizer
        if: steps.blackboard.outputs.needs_summary == 'true'
        run: python -m llm_blackboard
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
